<!DOCTYPE html>
<html>
<head>
  <title>Generate MOS Tools Icons</title>
</head>
<body>
  <h1>MOS Tools Icons</h1>
  <p>Right-click on each canvas and "Save image as" to save the icon:</p>
  
  <h3>16x16</h3>
  <canvas id="icon16" width="16" height="16"></canvas>
  
  <h3>48x48</h3>
  <canvas id="icon48" width="48" height="48"></canvas>
  
  <h3>128x128</h3>
  <canvas id="icon128" width="128" height="128"></canvas>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const center = size / 2;
      const radius = size * 0.4;
      
      // Blue circle
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#3B82F6';
      ctx.lineWidth = size * 0.08;
      ctx.stroke();
      
      // Checkmark
      ctx.beginPath();
      ctx.strokeStyle = '#3B82F6';
      ctx.lineWidth = size * 0.08;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.moveTo(center - radius * 0.5, center);
      ctx.lineTo(center - radius * 0.1, center + radius * 0.4);
      ctx.lineTo(center + radius * 0.5, center - radius * 0.4);
      ctx.stroke();
    }
    
    drawIcon(document.getElementById('icon16'), 16);
    drawIcon(document.getElementById('icon48'), 48);
    drawIcon(document.getElementById('icon128'), 128);
  </script>
</body>
</html>
