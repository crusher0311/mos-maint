<!DOCTYPE html>
<html>
<head>
  <title>API Sniffer - Detect Dog Dev Tools</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, monospace;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-title {
      font-size: 15px;
      font-weight: 600;
      color: #f0f6fc;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 8px;
    }
    .toolbar-title img { width: 20px; height: 20px; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.active { background: #3fb950; box-shadow: 0 0 6px #3fb95088; }
    .status-dot.inactive { background: #6e7681; }
    .toolbar-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toolbar-btn:hover { background: #30363d; border-color: #484f58; }
    .toolbar-btn.primary { background: #238636; border-color: #2ea043; color: #fff; }
    .toolbar-btn.primary:hover { background: #2ea043; }
    .toolbar-btn.danger { background: #b6291088; border-color: #da3633; color: #f85149; }
    .toolbar-btn.danger:hover { background: #da363388; }
    .toolbar-select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      cursor: pointer;
    }
    .toolbar-input {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #c9d1d9;
      font-size: 12px;
      width: 200px;
    }
    .toolbar-input::placeholder { color: #484f58; }
    .toolbar-input:focus { outline: none; border-color: #58a6ff; }
    .toolbar-spacer { flex: 1; }
    .capture-count {
      font-size: 12px;
      color: #8b949e;
      padding: 4px 10px;
      background: #0d1117;
      border-radius: 12px;
    }
    .captures-list { padding: 0 20px 20px; }
    .capture-item {
      border: 1px solid #21262d;
      border-radius: 8px;
      margin-top: 8px;
      background: #161b22;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .capture-item:hover { border-color: #30363d; }
    .capture-header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .capture-header:hover { background: #1c2128; }
    .method-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      min-width: 52px;
      text-align: center;
    }
    .method-badge.POST { background: #238636; color: #fff; }
    .method-badge.PUT { background: #9e6a03; color: #fff; }
    .method-badge.PATCH { background: #8957e5; color: #fff; }
    .method-badge.DELETE { background: #da3633; color: #fff; }
    .method-badge.GET { background: #1f6feb; color: #fff; }
    .capture-path {
      font-size: 13px;
      color: #c9d1d9;
      font-family: monospace;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .platform-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .platform-badge.tekmetric { background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb44; }
    .platform-badge.autoflow { background: #23863622; color: #3fb950; border: 1px solid #23863644; }
    .platform-badge.shopware { background: #9e6a0322; color: #d29922; border: 1px solid #9e6a0344; }
    .platform-badge.unknown { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
    .category-tag {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      background: #30363d;
      color: #8b949e;
    }
    .category-tag.dvi { background: #da363322; color: #f85149; }
    .category-tag.estimates { background: #9e6a0322; color: #d29922; }
    .category-tag.scheduling { background: #1f6feb22; color: #58a6ff; }
    .category-tag.communication { background: #8957e522; color: #bc8cff; }
    .category-tag.authorization { background: #23863622; color: #3fb950; }
    .capture-time {
      font-size: 11px;
      color: #484f58;
      white-space: nowrap;
    }
    .capture-status {
      font-size: 11px;
      font-weight: 600;
      font-family: monospace;
    }
    .capture-status.s2xx { color: #3fb950; }
    .capture-status.s3xx { color: #d29922; }
    .capture-status.s4xx { color: #f85149; }
    .capture-status.s5xx { color: #f85149; }
    .capture-body {
      display: none;
      border-top: 1px solid #21262d;
      padding: 16px;
    }
    .capture-body.open { display: block; }
    .body-section {
      margin-bottom: 16px;
    }
    .body-section:last-child { margin-bottom: 0; }
    .body-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .body-content {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
      line-height: 1.6;
      color: #c9d1d9;
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #484f58;
    }
    .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: #8b949e; }
    .empty-state p { font-size: 13px; line-height: 1.6; max-width: 400px; margin: 0 auto; }
    .expand-arrow {
      font-size: 10px;
      color: #484f58;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .capture-item.expanded .expand-arrow { transform: rotate(90deg); }
    .not-admin {
      text-align: center;
      padding: 100px 20px;
    }
    .not-admin h2 { color: #f85149; margin-bottom: 8px; }
    .not-admin p { color: #8b949e; font-size: 14px; }
  </style>
</head>
<body>
  <div id="not-admin" class="not-admin" style="display:none;">
    <h2>Access Denied</h2>
    <p>The API Sniffer is only available to platform administrators.</p>
  </div>

  <div id="app" style="display:none;">
    <div class="toolbar">
      <div class="toolbar-title">
        <img src="icons/icon48.png" alt="MOS">
        <span>API Sniffer</span>
        <span id="status-dot" class="status-dot inactive"></span>
      </div>

      <button id="toggle-btn" class="toolbar-btn primary">Start Capture</button>
      <button id="clear-btn" class="toolbar-btn danger">Clear</button>

      <div class="toolbar-spacer"></div>

      <select id="filter-platform" class="toolbar-select">
        <option value="">All Platforms</option>
        <option value="tekmetric">Tekmetric</option>
        <option value="autoflow">AutoFlow</option>
        <option value="shopware">Shop-Ware</option>
      </select>

      <select id="filter-category" class="toolbar-select">
        <option value="">All Categories</option>
        <option value="dvi">DVI / Inspections</option>
        <option value="estimates">Estimates / Jobs</option>
        <option value="scheduling">Scheduling</option>
        <option value="customers">Customers</option>
        <option value="vehicles">Vehicles</option>
        <option value="communication">Communication</option>
        <option value="authorization">Authorization</option>
        <option value="repair_orders">Repair Orders</option>
        <option value="other">Other</option>
      </select>

      <select id="filter-method" class="toolbar-select">
        <option value="">All Methods</option>
        <option value="POST">POST</option>
        <option value="PUT">PUT</option>
        <option value="PATCH">PATCH</option>
        <option value="DELETE">DELETE</option>
        <option value="GET">GET</option>
      </select>

      <input type="text" id="filter-search" class="toolbar-input" placeholder="Search URL or body...">

      <button id="export-btn" class="toolbar-btn">Export JSON</button>
      <button id="upload-btn" class="toolbar-btn" title="Upload captures to MOS server">⬆ Upload</button>

      <span id="upload-status" class="capture-count" style="display:none;"></span>
      <span id="capture-count" class="capture-count">0 captures</span>
    </div>

    <div id="captures-list" class="captures-list"></div>

    <div id="empty-state" class="empty-state">
      <h2>No Captures Yet</h2>
      <p>Click "Start Capture" to begin recording API calls. Use your SMS normally — the sniffer will record all matching requests in the background.</p>
    </div>
  </div>

  <script src="sniffer-ui.js"></script>
</body>
</html>
